<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sfairos 1/1</title>
<meta name="description" content="Sfairos · tessera 1/1 · Il Creatore. Ne esiste una sola.">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sfairos 1/1">
<meta property="og:title" content="Sfairos · 1/1 · Il Creatore">
<meta property="og:description" content="Ne esiste una sola.">
<meta property="og:image" content="anteprima.jpg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icona-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  @property --ang { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #000; color: #e8eaf6; font-family: Inter, system-ui, sans-serif; overflow: hidden; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
         padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
         background: radial-gradient(900px 600px at 50% 40%, #150f33 0%, #000 70%); }

  .stage { perspective: 1100px; width: min(92vw, 640px, calc(76dvh * 85.6 / 54)); }
  .card { width: 100%; aspect-ratio: 85.6/54; border-radius: 4.3cqw; position: relative; container-type: inline-size;
          touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab;
          transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); transition: transform .5s cubic-bezier(.2,.8,.2,1);
          box-shadow: 0 50px 90px -30px #000, 0 0 90px -20px #8b5cf666; --mx: 50%; --my: 50%; --a: 120; }
  .card.live { transition: transform .08s linear; }
  .face { position: absolute; inset: 0; border-radius: inherit; overflow: hidden; background: #000; isolation: isolate;
          clip-path: inset(0 round 4.3cqw); -webkit-mask-image: -webkit-radial-gradient(white, black); transform: translateZ(0); }
  .face::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 1px #ffffff26; pointer-events: none; }
  .card .micro { position: absolute; inset: 0; opacity: .05; font: 700 1.6cqw/1.9cqw "JetBrains Mono", monospace; letter-spacing: .4em; color: #fff; word-break: break-all; overflow: hidden; padding: 1cqw; }
  .card .ripples { position: absolute; inset: 0; opacity: .5;
     background: repeating-radial-gradient(circle at 72% 50%, transparent 0 1.4cqw, #ffffff0d 1.4cqw 1.6cqw);
     -webkit-mask: radial-gradient(circle at 72% 50%, #000 10%, transparent 75%); mask: radial-gradient(circle at 72% 50%, #000 10%, transparent 75%); }
  .ecl { position: absolute; width: 40cqw; aspect-ratio: 1; left: 72%; top: 50%; translate: -50% -50%; }
  .corona { position: absolute; inset: -22%; border-radius: 50%;
     background: conic-gradient(from var(--ang), #8b5cf6, #38bdf8, #22c55e, #ffe45c, #ff9a3d, #ff5fa2, #8b5cf6);
     filter: blur(3.4cqw); opacity: .95; animation: ang 9s linear infinite;
     -webkit-mask: radial-gradient(circle, transparent 42%, #000 47%, transparent 72%); mask: radial-gradient(circle, transparent 42%, #000 47%, transparent 72%); }
  .rim { position: absolute; inset: -1.5%; border-radius: 50%;
     background: conic-gradient(from var(--ang), #c4b5fd, #7dd3fc, #86efac, #fde68a, #fdba74, #f9a8d4, #c4b5fd); animation: ang 9s linear infinite;
     -webkit-mask: radial-gradient(circle, transparent 69.5%, #000 70%); mask: radial-gradient(circle, transparent 69.5%, #000 70%); }
  .disc { position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 38% 32%, #1c1c26 0%, #050508 55%, #000 100%);
     box-shadow: inset 0 0 6cqw #000, inset 0 -1cqw 3cqw #8b5cf633; }
  .eye { position: absolute; top: 33%; width: 7.5%; height: 26%; border-radius: 99px; background: #fff; box-shadow: 0 0 2cqw #ffffffaa; animation: blink 6s infinite;
     translate: calc((var(--px, .5) - .5) * 2.4cqw) calc((var(--py, .5) - .5) * 2cqw); }
  .eye.l { left: 31%; } .eye.r { right: 31%; }
  @keyframes blink { 0%, 46%, 50%, 100% { transform: scaleY(1); } 48% { transform: scaleY(.1); } }
  @keyframes ang { to { --ang: 360deg; } }
  .chrome { background: linear-gradient(180deg, #ffffff 0%, #d9dbe4 38%, #7f8496 52%, #f4f5fa 64%, #a9adbd 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .logo { position: absolute; left: 6cqw; top: 6cqw; height: 6cqw; pointer-events: none; }
  .one { position: absolute; left: 5.4cqw; top: 15cqw; font-size: 20cqw; font-weight: 800; letter-spacing: -0.06em; line-height: 1; }
  /* la barra ha la sua sfumatura: su iPhone un pezzo di testo con opacity dentro un testo "ritagliato" sparisce */
  .one i { font-style: normal; font-weight: 400; margin: 0 .5cqw;
           background: linear-gradient(180deg, #9a9db0 0%, #6e7286 50%, #a3a6b8 100%); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; }
  .role { position: absolute; left: 6cqw; top: 38cqw; font-size: 2.6cqw; letter-spacing: .5em; font-weight: 600; color: #ffffffb3; }
  .name { position: absolute; left: 6cqw; bottom: 9cqw; font-size: 4.4cqw; font-weight: 700; letter-spacing: -0.01em; }
  .sig { position: absolute; left: 6cqw; bottom: 5.2cqw; font: 500 2.4cqw "JetBrains Mono", monospace; color: #ffffff70; letter-spacing: .14em; }
  .holo { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: color-dodge; opacity: .16;
     background: linear-gradient(calc(var(--a) * 1deg), transparent 30%, #8b5cf6 42%, #38bdf8 50%, #22c55e 58%, transparent 70%); }
  .shine { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: overlay; background: radial-gradient(circle at var(--mx) var(--my), #ffffff66 0%, transparent 40%); }

  .bar { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  button { font: 600 15px Inter, sans-serif; color: #fff; background: #ffffff12; border: 1px solid #ffffff26; border-radius: 99px; padding: 12px 18px; cursor: pointer; }
  button:active { background: #ffffff22; }
  button[hidden] { display: none; }
  .hint { font-size: 13px; color: #ffffff66; text-align: center; margin: -12px 0 0; }
  @media (display-mode: standalone) { #install { display: none; } }
  .sheet { position: fixed; inset: 0; background: #000c; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); display: flex; align-items: flex-end; justify-content: center;
           padding: 16px 16px calc(70px + env(safe-area-inset-bottom)); z-index: 10; }
  .sheet[hidden] { display: none; }
  .panel { width: min(100%, 420px); background: #12121c; border: 1px solid #ffffff22; border-radius: 22px; padding: 22px; }
  .panel .t { margin: 0 0 12px; font-weight: 700; font-size: 18px; }
  .panel ol { margin: 0 0 18px; padding-left: 20px; line-height: 1.7; color: #d4d6e4; }
  .panel b { color: #fff; }
  .panel button { width: 100%; }
  .ico { display: inline-block; vertical-align: -3px; width: 18px; height: 18px; }
  .arrow { position: fixed; bottom: calc(14px + env(safe-area-inset-bottom)); left: 50%; translate: -50% 0; font-size: 34px; color: #fff; animation: bob 1s ease-in-out infinite; }
  .arrow[hidden] { display: none; }
  @keyframes bob { 50% { transform: translateY(8px); } }
</style>
</head>
<body>
  <div class="stage">
    <div class="card" id="card"><div class="face">
      <div class="micro" id="micro"></div><div class="ripples"></div>
      <div class="ecl"><div class="corona"></div><div class="rim"></div><div class="disc"></div><div class="eye l"></div><div class="eye r"></div></div>
      <img class="logo" src="logo.svg" alt="Sfairos">
      <div class="one chrome">1<i>/</i>1</div><div class="role">IL CREATORE</div>
      <div class="name chrome">Francesco C.</div><div class="sig">ORIGINE · DOVE TUTTO È COMINCIATO</div>
      <div class="holo"></div><div class="shine"></div>
    </div></div>
  </div>

  <div class="bar">
    <button id="gyro" hidden>Muovila col telefono</button>
    <button id="install">Mettila nella schermata Home</button>
  </div>
  <p class="hint">Tocca e trascina la carta per farla girare.</p>

  <div class="sheet" id="sheet" hidden>
    <div class="panel">
      <p class="t">Mettila nella schermata Home</p>
      <ol id="steps"></ol>
      <button id="close">Ho capito</button>
    </div>
    <div class="arrow" id="arrow">↓</div>
  </div>

<script>
  const card = document.getElementById("card");
  document.getElementById("micro").textContent = "SFAIROS·1/1·".repeat(260);

  /** Inclina la carta: px e py vanno da 0 a 1 (0,5 = dritta). */
  function tilt(px, py) {
    px = Math.min(1, Math.max(0, px)); py = Math.min(1, Math.max(0, py));
    card.style.setProperty("--ry", (px - .5) * 22 + "deg");
    card.style.setProperty("--rx", (.5 - py) * 22 + "deg");
    card.style.setProperty("--mx", px * 100 + "%"); card.style.setProperty("--my", py * 100 + "%");
    card.style.setProperty("--px", px); card.style.setProperty("--py", py);
    card.style.setProperty("--a", 60 + (px + py) * 60);
  }
  const rest = () => { card.classList.remove("live"); tilt(.5, .5); };

  // mouse e dito
  let dragging = false;
  const fromEvent = (e) => { const r = card.getBoundingClientRect(); tilt((e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height); };
  card.addEventListener("pointerdown", (e) => { dragging = true; card.classList.add("live"); card.setPointerCapture(e.pointerId); fromEvent(e); });
  card.addEventListener("pointermove", (e) => { if (dragging || e.pointerType === "mouse") { card.classList.add("live"); fromEvent(e); } });
  card.addEventListener("pointerup", () => { dragging = false; if (!gyroOn) rest(); });
  card.addEventListener("pointercancel", () => { dragging = false; if (!gyroOn) rest(); });
  card.addEventListener("pointerleave", (e) => { if (e.pointerType === "mouse") rest(); });

  // giroscopio: la carta segue il telefono
  let gyroOn = false, base = null;
  function onOrient(e) {
    if (dragging || e.beta == null) return;
    if (!base) base = { b: e.beta, g: e.gamma };
    card.classList.add("live");
    tilt(.5 + (e.gamma - base.g) / 50, .5 + (e.beta - base.b) / 50);
  }
  const gyroBtn = document.getElementById("gyro");
  if (window.DeviceOrientationEvent && matchMedia("(pointer: coarse)").matches) {
    gyroBtn.hidden = false;
    gyroBtn.addEventListener("click", async () => {
      if (gyroOn) { gyroOn = false; window.removeEventListener("deviceorientation", onOrient); gyroBtn.textContent = "Muovila col telefono"; rest(); return; }
      try {
        if (typeof DeviceOrientationEvent.requestPermission === "function" && (await DeviceOrientationEvent.requestPermission()) !== "granted") return;
        base = null; gyroOn = true; window.addEventListener("deviceorientation", onOrient); gyroBtn.textContent = "Ferma";
      } catch { gyroBtn.hidden = true; }
    });
  }

  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  // schermata Home: su Android Chrome la installa direttamente, su iPhone spiega il tasto Condividi di Safari
  let installEvt = null;
  window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); installEvt = e; });
  window.addEventListener("appinstalled", () => { document.getElementById("install").hidden = true; });
  if (navigator.standalone) document.getElementById("install").hidden = true;
  const shareIcon = '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>';
  const sheet = document.getElementById("sheet"), steps = document.getElementById("steps"), arrow = document.getElementById("arrow");
  document.getElementById("install").addEventListener("click", async () => {
    if (installEvt) { installEvt.prompt(); await installEvt.userChoice; installEvt = null; return; }
    const ua = navigator.userAgent, ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    const safari = ios && !/CriOS|FxiOS|EdgiOS|GSA|Instagram|FBAN|FBAV/.test(ua);
    if (ios && safari) {
      steps.innerHTML = `<li>Tocca il tasto <b>Condividi</b> ${shareIcon} nella barra di Safari, qui sotto</li><li>Scorri e scegli <b>“Aggiungi alla schermata Home”</b></li><li>Tocca <b>Aggiungi</b></li>`;
      arrow.hidden = false;
    } else if (ios) {
      steps.innerHTML = `<li>Apri questa pagina in <b>Safari</b> (su iPhone solo Safari può aggiungerla alla Home)</li><li>Tocca <b>Condividi</b> ${shareIcon}</li><li>Scegli <b>“Aggiungi alla schermata Home”</b></li>`;
      arrow.hidden = true;
    } else {
      steps.innerHTML = `<li>Apri il menu del browser <b>⋮</b></li><li>Scegli <b>“Aggiungi a schermata Home”</b> o <b>“Installa app”</b></li>`;
      arrow.hidden = true;
    }
    sheet.hidden = false;
  });
  document.getElementById("close").addEventListener("click", () => { sheet.hidden = true; });
  sheet.addEventListener("click", (e) => { if (e.target === sheet) sheet.hidden = true; });
</script>
</body>
</html>
